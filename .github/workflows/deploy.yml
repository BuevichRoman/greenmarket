name: Deploy to prod

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/migrations/**"
      - "seller-cabinet/**"
      - "ci/**"
      - ".github/workflows/deploy.yml"
  # Ручной запуск. Прод сообщает развёрнутый коммит в /health, и ежедневная
  # проверка расхождения (deploy-drift.yml) сравнивает его с main буквально —
  # изменения вне paths выше (документация, Apps Script) деплой не запускают,
  # и прод честно отстаёт по хешу, не отличаясь по коду. Починка, которую
  # советует сама проверка, — `gh workflow run deploy.yml`; без этого триггера
  # совет не работал.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash /opt/greenmarket/deploy.sh
