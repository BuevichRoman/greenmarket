# Ежедневная проверка, что прод не отстал от main.
#
# Зачем. Деплой (deploy.yml) о своём падении никак не сообщает: 06.08.2026 он
# упал на подготовке раннера («Failed to resolve action download info: Service
# Unavailable» — сбой на стороне GitHub, до сервера подключение не дошло), и
# прод простоял на день позади main, пока это не заметили случайно. Проверять
# каждый конкретный способ сломаться бессмысленно — проверяем следствие:
# совпадает ли то, что развёрнуто, с тем, что в main.
#
# Ловит не только упавший деплой, но и любую другую причину расхождения:
# ручной откат на сервере, правку файла мимо git, незапустившийся workflow.
#
# Проверка только читает: fetch и сравнение хешей, рабочее дерево на сервере
# не трогается. Чинить расхождение она не пытается — деплой запускается
# осознанно, а не по расписанию.

name: Deploy drift check

on:
  schedule:
    # 06:00 UTC — 09:00 по Москве, чтобы расхождение попадалось утром.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Compare deployed commit with origin/main
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/greenmarket
            git fetch origin main --quiet
            deployed="$(git rev-parse HEAD)"
            expected="$(git rev-parse origin/main)"

            if [ "$deployed" = "$expected" ]; then
              echo "прод соответствует main: ${deployed:0:8}"
              exit 0
            fi

            behind="$(git rev-list --count "$deployed".."$expected")"
            ahead="$(git rev-list --count "$expected".."$deployed")"

            echo "РАСХОЖДЕНИЕ: развёрнуто ${deployed:0:8}, в main ${expected:0:8}"
            echo "отстаёт на $behind коммит(ов), опережает на $ahead"
            echo
            echo "не доехало на прод:"
            git log --oneline "$deployed".."$expected"
            echo
            echo "Починка: запустить workflow «Deploy to prod» вручную"
            echo "(gh workflow run deploy.yml) либо на сервере — bash /opt/greenmarket/deploy.sh"
            exit 1
